name: Generate Processed Metrics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate processed metrics from raw data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate processed metrics for all operators
        run: |
          for operator_dir in data/open-spec-matrics/operators/*/; do
            operator=$(basename "$operator_dir")
            echo "Processing: $operator"
            python3 scripts/generate_processed_metrics.py \
              --raw-dir "$operator_dir" \
              --output "data/processed/${operator}_epics.json" \
              --qe-output "data/processed/${operator}_qe.json"
          done
          python3 scripts/generate_sdlc_summary.py

      - name: Upload processed metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-metrics
          path: data/processed/
