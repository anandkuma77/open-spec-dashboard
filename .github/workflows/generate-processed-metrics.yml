name: Generate Processed Metrics

on:
  push:
    branches: [main]
    paths:
      - 'data/open-spec-matrics/operators/**/*.json'
      - 'scripts/generate_processed_metrics.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate processed metrics from raw data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate processed metrics for all operators
        run: |
          for operator_dir in data/open-spec-matrics/operators/*/; do
            operator=$(basename "$operator_dir")
            echo "Processing: $operator"
            python3 scripts/generate_processed_metrics.py \
              --raw-dir "$operator_dir" \
              --output "data/processed/${operator}_epics.json" \
              --qe-output "data/processed/${operator}_qe.json"
          done

      - name: Create PR with processed metrics
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: data/processed/
          commit-message: 'chore: regenerate processed metrics from raw data'
          title: 'chore: regenerate processed metrics from raw data'
          body: |
            Auto-generated by the **Generate Processed Metrics** workflow.

            Updates processed epics and QE JSON files from the latest raw metric data.
          branch: auto/processed-metrics
          delete-branch: true
